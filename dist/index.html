<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101316">
  <meta name="description" content="维护通用武器数据，通过人体部位伤害、距离曲线与概率分布分析 BTK 和 TTK。">
  <title>WEAPON ATLAS · 武器数据工坊</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css?v=1.2.1">
  <link rel="stylesheet" href="./visuals.css?v=1.2.1">
</head>
<body>
  <header class="app-header">
    <a class="brand" href="#analysis" aria-label="武器数据工坊首页"><span class="brand-mark">W<span>Λ</span></span><span>WEAPON ATLAS<small>武器数据工坊</small></span></a>
    <nav class="main-nav" aria-label="主导航"><button data-view="analysis" class="active">武器分析</button><button data-view="maintain">数据维护</button></nav>
    <div class="header-actions"><span id="storage-status" class="storage-status"><i></i> 本地草稿</span><button id="import-db" class="button ghost compact">↥ 导入 JSON</button><button id="export-db" class="button compact">↧ 导出数据库</button></div>
  </header>
  <div class="app-shell">
    <aside class="sidebar" aria-label="武器库">
      <div class="sidebar-heading"><span>武器库 <span id="weapon-count" class="count"></span></span><span class="eyebrow">ARMORY</span></div>
      <label class="search-box"><span aria-hidden="true">⌕</span><input id="weapon-search" type="search" placeholder="搜索武器名称" aria-label="搜索武器"></label>
      <select id="category-filter" aria-label="筛选武器类别"><option value="">全部类别</option></select>
      <div class="roster-help"><span>勾选加入对比 ↓</span><button id="clear-selection" class="text-button" type="button" disabled>取消已选</button></div>
      <div id="weapon-roster" class="weapon-roster"></div>
      <div class="sidebar-bottom"><button id="new-weapon" class="button full">＋ 新建武器</button><button id="temporary-weapon" class="button ghost full">自由试算 <span>↗</span></button><div class="sidebar-note"><span class="tiny-cross">＋</span><p>以数据理解每一次命中<small>MODE DATA · VERSION HISTORY</small></p></div></div>
    </aside>
    <main id="main-content" tabindex="-1"></main>
  </div>
  <footer class="app-footer"><span>WEAPON ATLAS <b>/</b> 数据驱动的武器分析</span><span>首发扣扳机计时 · 全程部位倍率 · 默认全部命中</span><button id="method-button">计算口径 ↗</button></footer>
  <input id="file-input" type="file" accept=".json,application/json" hidden>
  <dialog id="app-dialog" class="app-dialog"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript>请启用 JavaScript 使用武器数据工坊。</noscript>
  <script type="module" src="./app.js?v=1.2.1"></script>
</body>
</html>
